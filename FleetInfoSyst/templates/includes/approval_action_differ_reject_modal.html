<!-- Approval Action Modal -->
<div class="modal fade" id="approvalActionDifferRejectModal" tabindex="-1" aria-labelledby="approvalActionActivityRequestsLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="approvalActionActivityRequests">Differ/ Reject Request</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="approvalForm">
                    <div class="form-group">
                        <label for="approvalActionDifferReject">Select Action<span class="text-danger">*</span></label>
                        <select class="form-control" id="approvalActionDifferReject" required>
                            <option value="">-- Select Action --</option>
                            <option value="differ">Differ with comment</option>
                            <option value="reject">Reject with comment</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="approvalDifferRejectComment">Comments<span class="text-danger">*</span></label>
                        <textarea class="form-control" id="approvalDifferRejectComment" rows="3" placeholder="Enter comments..." maxlength="254" required></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-outline-custom2" data-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary btn-outline-custom" id="confirmApprovalActionDifferReject">Submit</button>
            </div>
        </div>
    </div>
</div>
