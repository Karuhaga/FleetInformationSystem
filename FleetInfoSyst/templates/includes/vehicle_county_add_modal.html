<!-- Approval Action Modal -->
<div class="modal fade" id="vehicleCountyAddModal" tabindex="-1" aria-labelledby="approvalActionModalLabel1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="approvalActionModalLabel">Add Vehicle County</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">

            <form id="addVehicleCountyForm" class="p-2 rounded shadow-sm bg-white">
                <div class="mb-3 row align-items-center">
                    <label for="vehicleCountyName" class="col-md-4 col-form-label fw-semibold">Vehicle Model Name <span class="text-danger">*</span></label>
                    <div class="col-md-8">
                        <input type="text" name="vehicleCountyName" id="vehicleCountyName" maxlength="50" class="form-control" required>
                    </div>
                </div>
                <div class="mb-3 row align-items-center">
                    <label for="add_vehicle_county_vehicle_district_id" class="col-md-4 col-form-label fw-semibold">Vehicle Make <span class="text-danger">*</span></label>
                    <div class="col-md-8">
                        <select class="form-control" id="add_vehicle_county_vehicle_district_id" name="add_vehicle_county_vehicle_district_id" required>
                            {{ vehicle_district_options | safe }}
                        </select>
                    </div>
                </div>
            </form>

            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-outline-custom2" data-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary btn-outline-custom" onclick="showVehicleCountyConfirmation('add vehicle county')">Add</button>
            </div>
        </div>
    </div>
</div>

<script>

</script>
