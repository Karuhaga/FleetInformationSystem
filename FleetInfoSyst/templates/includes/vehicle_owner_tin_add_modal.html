<!-- Approval Action Modal -->
<div class="modal fade" id="vehicleOwnerTinAddModal" tabindex="-1" aria-labelledby="approvalActionModalLabel1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="approvalActionModalLabel">Add Vehicle Owner TIN</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">

            <form id="addVehicleOwnerTinForm" class="p-2 rounded shadow-sm bg-white">
                <div class="mb-3 row align-items-center">
                    <label for="vehicleOwnerTinName" class="col-md-4 col-form-label fw-semibold">Vehicle Body Description <span class="text-danger">*</span></label>
                    <div class="col-md-8">
                        <input type="text" name="vehicleOwnerTinName" id="vehicleOwnerTinName" maxlength="50" class="form-control" style="text-align: right;" inputmode="numeric" pattern="[0-9]+" autocomplete="off" required>
                    </div>
                </div>
            </form>

            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-outline-custom2" data-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary btn-outline-custom" onclick="showVehicleBodyDescriptionConfirmation('add vehicle owner tin')">Add</button>
            </div>
        </div>
    </div>
</div>

<script>
// Prevent non-digit characters while typing
document.getElementById("vehicleOwnerTinName").addEventListener("input", function () {
    this.value = this.value.replace(/\D/g, "");
});
</script>
