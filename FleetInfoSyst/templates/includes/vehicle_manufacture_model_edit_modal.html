<!-- Approval Action Modal -->
<div class="modal fade" id="vehicleModelEditModal" tabindex="-1" aria-labelledby="approvalActionModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="approvalActionModalLabel">Edit Vehicle Model</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">

            <form id="editVehicleModelForm" class="p-4 rounded shadow-sm bg-white">
                <input type="hidden" id="editVehicleModelId">

                <div class="mb-3 row align-items-center">
                    <label for="vehicle_model_name_2" class="col-md-4 col-form-label fw-semibold">Vehicle Make Name <span class="text-danger">*</span></label>
                    <div class="col-md-8">
                        <input type="text" name="vehicle_model_name_2" id="vehicle_model_name_2" maxlength="50" class="form-control" required>
                    </div>
                    <div class="mb-3 row align-items-center">
                        <label for="edit_vehicle_model_vehicle_make_id" class="col-md-4 col-form-label fw-semibold">Vehicle Make <span class="text-danger">*</span></label>
                        <div class="col-md-8">
                            <select class="form-control" id="edit_vehicle_model_vehicle_make_id" name="add_vehicle_model_vehicle_make_id" required>
                                {{ vehicle_make_options | safe }}
                            </select>
                        </div>
                    </div>
                </div>
            </form>

            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-outline-custom2" data-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary btn-outline-custom" id="confirmKeyProcessEditAction" onclick="showVehicleModelConfirmation('edit vehicle model')">Update</button>
            </div>
        </div>
    </div>
</div>

<script>

</script>
